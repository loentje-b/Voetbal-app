<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wekdienst</title><meta name="theme-color" content="#000000">
<style>
:root{--bg:#fff;--tx:#111;--mu:#767676;--ln:#e4e4e4;--bar:#000;--btn:#000;--btt:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#000;--tx:#f2f2f2;--mu:#9a9a9a;--ln:#2a2a2a;--bar:#151515;--btn:#fff;--btt:#000}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,system-ui,"Helvetica Neue",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--bar);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:baseline}
h1{margin:0;font-size:24px;font-weight:900;letter-spacing:.08em;font-style:italic}header a{color:#fff;font-size:14px}
article{max-width:680px;margin:auto;padding:20px 18px 60px}
.lab{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
h2{font-size:30px;line-height:1.12;font-weight:800;margin:6px 0 18px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;border-bottom:2px solid var(--tx);padding-bottom:4px;margin:26px 0 10px}
p,li{font-size:18px;line-height:1.6;margin:0 0 14px}ul{padding-left:20px;margin:0 0 14px}
.mu{color:var(--mu);font-size:13px}
</style></head><body>
<header><h1>WEKDIENST</h1><a href="index.html">Naar de app ›</a></header>
<article id="a"><p class="mu">Laden…</p></article>
<script>
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('data/briefing.json').then(r=>r.json()).then(b=>{
let h='',ul=false;const close=()=>{if(ul){h+='</ul>';ul=false}};
for(const l of b.body.split('\n')){const t=l.trim();
if(t.startsWith('## ')){close();h+=`<h3>${e(t.slice(3))}</h3>`}
else if(t.startsWith('- ')){if(!ul){h+='<ul>';ul=true}h+=`<li>${e(t.slice(2))}</li>`}
else if(t){close();h+=`<p>${e(t)}</p>`}}
close();
document.getElementById('a').innerHTML=`<span class="lab">${new Date(b.date).toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long',timeZone:'Europe/Amsterdam'})}</span><h2>${e(b.title)}</h2>${h}<p class="mu">Automatisch geschreven door AI op basis van nieuwskoppen en wedstrijdgegevens. Controleer belangrijke zaken bij de bron.</p>`
}).catch(()=>{document.getElementById('a').innerHTML='<p class="mu">Er is nog geen wekdienst beschikbaar.</p>'});
</script></body></html>
