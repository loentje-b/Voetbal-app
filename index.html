<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Voetbal</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Voetbal"><meta name="theme-color" content="#0b1d12">
<style>
:root{--bg:#0b1d12;--card:#14301f;--tx:#eef6f0;--mu:#8fb09a;--ac:#3ddc84}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:14px 16px 6px;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:22px}
nav{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;position:sticky;top:env(safe-area-inset-top);background:var(--bg)}
nav button,.chip{flex:none;border:0;border-radius:20px;padding:8px 14px;background:var(--card);color:var(--tx);font:inherit}
nav .on,.chip.on{background:var(--ac);color:#06210f;font-weight:600}
main{padding:8px 16px 40px}.card{display:block;background:var(--card);border-radius:12px;padding:12px 14px;margin:0 0 10px;color:inherit;text-decoration:none}
.card b{font-weight:600}.card small,.mu{color:var(--mu);display:block;margin-top:4px;font-size:13px}.star{color:var(--ac)}
h2{font-size:15px;color:var(--ac);margin:18px 0 8px}.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #ffffff14}
select{width:100%;padding:10px;border-radius:10px;border:0;background:var(--card);color:var(--tx);font:inherit;margin-bottom:10px}
table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;text-align:right}td:nth-child(2),th:nth-child(2){text-align:left;width:100%}th{color:var(--mu);font-weight:400;font-size:13px}
</style></head><body>
<header><h1>⚽ Voetbal</h1><span class="mu" id="up"></span></header>
<nav id="nav"></nav><main id="main"></main>
<script>
const TABS=[['nieuws','Nieuws'],['wedstrijden','Wedstrijden'],['standen','Standen'],['transfers','Transfers'],['blessures','Blessures'],['geruchten','Geruchten'],['meningen','Meningen']];
let D={tabs:{}},M={matches:[],tables:{}},tab='nieuws',mine=false,comp='';
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=d=>{const m=(Date.now()-new Date(d))/6e4;return m<60?Math.max(1,Math.round(m))+' min':m<1440?Math.round(m/60)+' u':Math.round(m/1440)+' d'};
async function load(){try{D=await fetch('data/news.json').then(r=>r.json())}catch{}try{M=await fetch('data/matches.json').then(r=>r.json())}catch{}render()}
function render(){
document.getElementById('up').textContent=D.updated?'Bijgewerkt '+ago(D.updated)+' geleden':'';
document.getElementById('nav').innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';render();scrollTo(0,0)">${l}</button>`).join('');
let h='';
if(tab==='wedstrijden'){const by={};M.matches.forEach(m=>(by[m.comp]??=[]).push(m));
h=Object.entries(by).map(([c,ms])=>`<h2>${e(c)}</h2>`+ms.sort((a,b)=>a.date.localeCompare(b.date)).map(m=>{const f=m.status==='FINISHED'||m.hs!=null;
return `<div class="row"><span>${e(m.home)} – ${e(m.away)}</span><b>${f?m.hs+' - '+m.as:new Date(m.date).toLocaleString('nl-NL',{weekday:'short',hour:'2-digit',minute:'2-digit'})}</b></div>`}).join('')).join('')||'<p class="mu">Nog geen wedstrijddata (zie stap met FD_KEY).</p>'}
else if(tab==='standen'){const ks=Object.keys(M.tables);comp=comp||ks[0]||'';
h=ks.length?`<select onchange="comp=this.value;render()">${ks.map(k=>`<option ${k===comp?'selected':''}>${e(k)}</option>`).join('')}</select><table><tr><th>#</th><th>Club</th><th>Gs</th><th>Dv</th><th>Pt</th></tr>${M.tables[comp].map(t=>`<tr><td>${t.pos}</td><td>${e(t.team)}</td><td>${t.pl}</td><td>${t.gd}</td><td><b>${t.pts}</b></td></tr>`).join('')}</table>`:'<p class="mu">Nog geen standen (zie stap met FD_KEY).</p>'}
else{h=`<button class="chip ${mine?'on':''}" onclick="mine=!mine;render()" style="margin-bottom:10px">⭐ Alleen Groningen & Liverpool</button>`;
const L=(D.tabs[tab]||[]).filter(i=>!mine||i.mine);
h+=L.map(i=>`<a class="card" href="${e(i.url)}" target="_blank" rel="noopener"><b>${i.mine?'<span class="star">⭐</span> ':''}${e(i.title)}</b><small>${e(i.source)} · ${ago(i.date)}</small></a>`).join('')||'<p class="mu">Niets gevonden.</p>'}
document.getElementById('main').innerHTML=h}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
load();document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
</script></body></html>
